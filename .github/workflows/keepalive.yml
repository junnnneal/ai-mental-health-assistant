name: Keep Render awake

# Render 免费版 15 分钟无流量就休眠，下次请求冷启动 50s+，会撞穿 Netlify
# 函数 60s 上限（线上表现为咨询页 502/504）。此 workflow 定时 ping /health
# 做保活兜底——UptimeRobot 正常时二者重叠无害，UptimeRobot 挂掉时它顶上。
# 私有仓库免费额度 2000 分钟/月：单次约 15s × 每 13 分钟 ≈ 1000 分钟，够用。
on:
  schedule:
    # 避开整点/整刻（Actions 高峰排队），13 分钟 < 15 分钟休眠线，留有余量
    - cron: "*/13 * * * *"
  workflow_dispatch: # 支持手动触发（Actions 页 Run workflow）

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping agent-server health
        run: |
          code=$(curl -sS -m 90 -o /dev/null -w "%{http_code}" https://ai-mental-agent.onrender.com/health)
          echo "health status: $code"
          # 非 200 视为失败，Actions 邮件会提醒（等于免费的宕机告警）
          test "$code" = "200"
